<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #172554 0%, #090d1f 55%, #020617 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .stage {
    position: relative; z-index: 2; text-align: center;
    padding: 24px 20px; width: 100%; max-width: 420px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .logo-orbit {
    position: relative; width: 176px; height: 176px;
    display: flex; align-items: center; justify-content: center;
    perspective: 900px;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #fbbf24; border-right-color: #38bdf8;
    animation: spin 4.2s linear infinite;
    box-shadow: 0 0 28px rgba(56,189,248,0.35);
  }
  .ring2 {
    position: absolute; inset: -12px; border-radius: 50%;
    border: 1.5px dashed rgba(251,191,36,0.45);
    animation: spinRev 9s linear infinite;
  }
  .ring3 {
    position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(251,191,36,0.28), rgba(56,189,248,0.12), transparent 72%);
    animation: pulseGlow 2.4s ease-in-out infinite;
  }
  .logo-card {
    position: relative; width: 136px; height: 136px; border-radius: 50%;
    background: #fff; padding: 6px;
    box-shadow: 0 0 42px rgba(251,191,36,0.65), 0 0 90px rgba(56,189,248,0.35);
    animation: logoCinemaIn 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards, floatLogo 3.6s ease-in-out 1.8s infinite;
    overflow: hidden;
  }
  .logo-card img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
  .logo-card::after {
    content: ""; position: absolute; top: -20%; left: -120%; width: 65%; height: 140%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent);
    transform: skewX(-24deg);
    animation: shimmerSweep 2.6s ease-in-out 1.2s infinite;
  }
  .brand {
    font-size: 30px; font-weight: 900; letter-spacing: 0.6px;
    background: linear-gradient(90deg, #fde047, #ffffff, #38bdf8, #fde047);
    background-size: 220% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    opacity: 0; transform: translateY(18px) scale(0.92);
    animation: textRise 1.1s ease 0.9s forwards, gradFlow 3.5s linear infinite;
  }
  .subtitle {
    font-size: 14px; font-weight: 700; color: #bae6fd;
    opacity: 0; transform: translateY(12px);
    animation: textRise 1s ease 1.7s forwards;
  }
  .gold-line {
    width: 0; height: 2.5px; border-radius: 99px;
    background: linear-gradient(90deg, transparent, #fbbf24, #38bdf8, transparent);
    animation: lineGrow 1.2s ease 2.2s forwards;
  }
  .tagline-main {
    font-size: 22px; font-weight: 900; color: #fde68a;
    text-shadow: 0 0 24px rgba(251,191,36,0.45);
    min-height: 34px; letter-spacing: 0.3px;
  }
  .tagline-sub {
    font-size: 14px; font-weight: 700; color: #cbd5e1;
    opacity: 0; transform: translateY(10px);
    animation: textRise 1.1s ease 5.2s forwards;
  }
  .wave-bar {
    display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 26px;
    margin-top: 6px; opacity: 0; animation: textRise 0.8s ease 0.6s forwards;
  }
  .wave-bar span {
    width: 4px; border-radius: 99px;
    background: linear-gradient(180deg, #fde047, #38bdf8);
    animation: eqBar 1.1s ease-in-out infinite;
  }
  .wave-bar span:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar span:nth-child(3) { animation-delay: 0.30s; }
  .wave-bar span:nth-child(4) { animation-delay: 0.45s; }
  .wave-bar span:nth-child(5) { animation-delay: 0.60s; }
  .wave-bar span:nth-child(6) { animation-delay: 0.25s; }
  .wave-bar span:nth-child(7) { animation-delay: 0.50s; }
  .progress-wrap {
    width: 210px; height: 4px; border-radius: 99px;
    background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 6px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #38bdf8, #fbbf24);
    animation: loadBar 12.2s linear forwards;
  }
  .skip-btn {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    padding: 3px 9px; border-radius: 999px;
    background: rgba(15,23,42,0.48); border: 1px solid rgba(251,191,36,0.3);
    color: rgba(253,230,138,0.82); font-size: 10px; font-weight: 700;
    backdrop-filter: blur(6px); cursor: pointer; line-height: 1.4;
  }
  .credit {
    position: fixed; bottom: 26px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: rgba(148,163,184,0.85); z-index: 2;
    opacity: 0; animation: textRise 1s ease 3.2s forwards;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes pulseGlow { 0%,100% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.12); opacity: 1; } }
  @keyframes logoCinemaIn {
    0% { opacity: 0; transform: scale(0.3) rotateY(-140deg) rotateZ(-18deg); }
    60% { opacity: 1; transform: scale(1.08) rotateY(14deg) rotateZ(4deg); }
    100% { opacity: 1; transform: scale(1) rotateY(0deg) rotateZ(0deg); }
  }
  @keyframes floatLogo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes shimmerSweep { 0% { left: -120%; } 45%,100% { left: 145%; } }
  @keyframes textRise { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes gradFlow { to { background-position: 220% center; } }
  @keyframes lineGrow { to { width: 190px; } }
  @keyframes eqBar { 0%,100% { height: 6px; } 50% { height: 24px; } }
  @keyframes loadBar { to { width: 100%; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="skip-btn" id="skipBtn" onclick="if(window.EduSplashBridge)window.EduSplashBridge.skip();">تخطي</button>
<div class="stage">
  <div class="logo-orbit">
    <div class="ring2"></div>
    <div class="ring"></div>
    <div class="ring3"></div>
    <div class="logo-card">
      <img src="file:///android_asset/public/assets/logo.png" alt="EduTech Mindset">
    </div>
  </div>
  <div>
    <div class="brand" dir="ltr">EduTech Mindset</div>
    <div class="subtitle">عقلية التعليم والتكنولوجيا • فلسطين 🇵🇸</div>
  </div>
  <div class="gold-line"></div>
  <div class="tagline-main" id="kineticText"></div>
  <div class="tagline-sub">نَحوَ عَقلِيَّةٍ تَصنَعُ المُستَقبَل ✨</div>
  <div class="wave-bar" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="progress-wrap"><div class="progress-fill"></div></div>
</div>
<div class="credit">إشراف أ. باسل أشرف الفقعاوي • الإصدار v3.2.1</div>
<script>
(function(){
  var c = document.getElementById('stars'), ctx = c.getContext('2d');
  var w = c.width = window.innerWidth, h = c.height = window.innerHeight;
  var pts = [];
  for (var i = 0; i < 65; i++) {
    pts.push({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*2.2 + 0.6,
      vx: (Math.random()-0.5)*0.45, vy: -Math.random()*0.65 - 0.15,
      gold: Math.random() > 0.45
    });
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    for (var i = 0; i < pts.length; i++){
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random()*w; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.gold ? 'rgba(251,191,36,0.68)' : 'rgba(56,189,248,0.62)';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
  var target = "رِحلَةُ التَّفَوُّقِ الذَّكِيِّ";
  var el = document.getElementById('kineticText');
  setTimeout(function(){
    var idx = 0;
    var iv = setInterval(function(){
      idx++;
      el.textContent = target.slice(0, idx);
      if (idx >= target.length) clearInterval(iv);
    }, 85);
  }, 2600);
})();
</script>
</body>
</html>
