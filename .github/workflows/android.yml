name: Build Android APK and AAB (v2.1.0)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Google Maven Central Mirror
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
              }
          }
          rootProject.name = "EduTech Mindset"
          include ':app'
          EOF
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK and PlayStore AAB
        run: gradle assembleDebug bundleDebug assembleRelease bundleRelease --max-workers=2 --stacktrace
      - name: Prepare dist artifacts
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1); fi
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then AAB_FILE=$(find app/build/outputs/bundle/debug -name "*.aab" | head -n 1); fi
          cp "$APK_FILE" dist/EduTech-Mindset-App.apk
          cp "$AAB_FILE" dist/EduTech-Mindset-PlayStore.aab
          ls -lh dist/
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduTech-Mindset-v2.1.0-Build
          path: dist/
      - name: Publish GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: EduTech Mindset v2.1.0 (Full Upgrade & 48 Tools)
          body: "EduTech Mindset Android v2.1.0 Official Release (EduTech-Mindset-App.apk & EduTech-Mindset-PlayStore.aab)"
          files: |
            dist/EduTech-Mindset-App.apk
            dist/EduTech-Mindset-PlayStore.aab
