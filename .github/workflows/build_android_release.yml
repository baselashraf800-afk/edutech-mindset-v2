name: Build EduTech Mindset Android App (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Capacitor dependencies & sync Android
        run: |
          npm install
          npx cap sync android

      - name: Decode signing keystore (if configured in secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/edutech-release.keystore

      - name: Build Debug & Release APK + AAB
        working-directory: android
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Read app version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -n1)
          echo "version=${V:-3.3.0}" >> "$GITHUB_OUTPUT"

      - name: Prepare release APK copy
        run: |
          mkdir -p release_out
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          fi
          cp "$APK" "release_out/EduTech-Mindset-${{ steps.ver.outputs.version }}.apk"
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1 || true)
          if [ -n "$AAB" ]; then
            cp "$AAB" "release_out/EduTech-Mindset-${{ steps.ver.outputs.version }}.aab"
          fi

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduTech-Mindset-Capacitor-v${{ steps.ver.outputs.version }}
          path: |
            release_out/*
          retention-days: 30

      - name: Publish GitHub Release automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: EduTech Mindset v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            release_out/*
