name: Build EduTech Mindset Android App (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Capacitor dependencies & sync Android
        run: |
          npm install
          npx cap sync android

      - name: Build Debug & Release APK + AAB
        working-directory: android
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduTech-Mindset-Capacitor-v3.2.1
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
